name: Daily HK Stock Scan (GGT)

on:
  schedule:
    # 星期一至五 12:15 HKT (上午收市後更新)
    - cron: '15 4 * * 1-5'
    # 星期一至五 16:20 HKT (下午收市後更新)
    - cron: '20 8 * * 1-5'
  workflow_dispatch: # 允許手動隨時觸發

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit and push updated dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update GGT dashboard $(date +'%Y-%m-%d %H:%M')" && git push)
