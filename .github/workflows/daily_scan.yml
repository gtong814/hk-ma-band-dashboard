name: Daily HK Stock Scan (GGT)

on:
  schedule:
    - cron: '17 4 * * 1-5'   # 香港時間 12:17 (週一至五)
    - cron: '23 8 * * 1-5'   # 香港時間 16:23 (週一至五)
  workflow_dispatch:

concurrency:
  group: daily-hk-stock-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scanner
        run: |
          python scanner.py

      - name: Commit and push updated dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add index.html sector_cache.json
          git diff --staged --quiet || git commit -m "Update GGT dashboard $(date -u +'%Y-%m-%d %H:%M')"
          git push origin main
